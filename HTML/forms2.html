<!DOCTYPE html>
<html>
    <head>
        <title>different types of buttons</title>
    </head>
    <body>
        <h1>Student Forms</h1>
        <form action="action/">
            <label for="x">name</label>
            <input type="text" placeholder="enter your name" id="x" name="stdname">
            <br>
            <label for="y">phone number</label>
            <input type="number" placeholde="type here" id="y" name="num">
            <br>
            <label for="z">password</label>
            <input type="password" placeholder="enter your password" id="z" name="pass">
            <hr>
            <label for="xx">are you 18+ </label>
            <input type="checkbox" id="xx" name="18+" unchecked>
            <br>
            <label for="male">male</label>
            <input type="radio" id="male" name="gender">
            <label for="female">female</label>
            <input type="radio" id="female" name="gender">
            <label for="other">other</label>
            <input type="radio" id="other" name="gender">
            <br>
            <label for="zx">enter your city</label>
            <select name="city" id="zx">
                <option type="surat">surat</option>
                <option type="ahmadavad">ahemdavad</option>
                <option type="rajkot">rajkot</option>
            </select>
        </form>
    </body>
</html>
